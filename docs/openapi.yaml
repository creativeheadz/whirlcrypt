openapi: 3.0.3
info:
  title: Whirlcrypt API
  description: |
    **Whirlcrypt** - Secure file sharing with RFC 8188 encryption
    
    End-to-end encrypted file sharing platform that ensures your files are encrypted 
    before they leave your browser. Built with security, privacy, and simplicity in mind.
    
    ## Security Features
    - RFC 8188 compliant encryption (AES-128-GCM)
    - Zero server-side key access
    - Automatic file expiration
    - Rate limiting and security headers
    
    ## Getting Started  
    1. Upload files with client-side encryption
    2. Share secure links with embedded keys (URL fragments)
    3. Files automatically expire based on retention settings
    
    **Repository**: [github.com/creativeheadz/whirlcrypt](https://github.com/creativeheadz/whirlcrypt)
  version: 1.0.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  contact:
    name: Whirlcrypt API Support
    url: https://github.com/creativeheadz/whirlcrypt

servers:
  - url: http://localhost:3001/api
    description: Development server
  - url: https://whirlcrypt.co.uk/api
    description: Production server

tags:
  - name: upload
    description: File upload operations
  - name: download
    description: File download operations  
  - name: admin
    description: Administrative operations
  - name: health
    description: Health check endpoints
  - name: config
    description: Public upload-limit discovery
  - name: auth
    description: Admin authentication (JWT + TOTP MFA)
  - name: security
    description: Security telemetry intake

paths:
  /upload:
    post:
      tags: [upload]
      summary: Upload encrypted file
      description: |
        Upload a file with client-side encryption. The file should be encrypted 
        using RFC 8188 before upload. Returns a unique file ID and download URL.
        
        **Rate Limited**: 10 uploads per 15 minutes per IP address.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, key, salt]
              properties:
                file:
                  type: string
                  format: binary
                  description: The encrypted file to upload
                key:
                  type: string
                  pattern: '^[0-9a-fA-F]{32}$'
                  description: 32-character hex-encoded encryption key
                  example: "a1b2c3d4e5f67890abcdef1234567890"
                salt:
                  type: string
                  pattern: '^[0-9a-fA-F]{32}$' 
                  description: 32-character hex-encoded salt
                  example: "1234567890abcdef1234567890abcdef"
                retentionHours:
                  type: integer
                  minimum: 1
                  maximum: 168
                  default: 24
                  description: File retention period in hours
                  example: 48
                allowedIps:
                  type: string
                  description: >
                    Optional comma-separated IPs or CIDR ranges (max 10) allowed
                    to download. Requests from other IPs get a 404. Omit or leave
                    blank for no restriction.
                  example: "203.0.113.7, 198.51.100.0/24"
      responses:
        '201':
          description: File uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/FileTooLarge' 
        '429':
          $ref: '#/components/responses/RateLimit'
        '500':
          $ref: '#/components/responses/ServerError'

  /download/{id}:
    get:
      tags: [download]
      summary: Download encrypted file
      description: |
        Download the encrypted file bytes. No key is sent to the server: the
        decryption key and salt travel in the share URL fragment
        (/download/:id#v=2&k=...&s=...), which browsers never transmit, and
        the client decrypts locally after downloading.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Unique file identifier
          example: "123e4567-e89b-12d3-a456-426614174000"
      responses:
        '200':
          description: File downloaded successfully
          headers:
            Content-Disposition:
              schema:
                type: string
              description: 'attachment; filename="original-filename.ext"'
            Content-Type:
              schema:
                type: string
              description: Original file MIME type
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /download/{id}/info:
    get:
      tags: [download]
      summary: Get file metadata
      description: Get file information without downloading the actual file
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Unique file identifier
      responses:
        '200':
          description: File metadata retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileInfo'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/stats:
    get:
      tags: [admin]
      summary: Get storage statistics
      security:
        - AdminJWT: []
      description: Retrieve current storage statistics and server configuration
      responses:
        '200':
          description: Statistics retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageStats'

  /admin/cleanup:
    post:
      tags: [admin]
      summary: Manual cleanup
      security:
        - AdminJWT: []
      description: Manually trigger cleanup of expired files
      responses:
        '200':
          description: Cleanup completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CleanupResult'

  /admin/config:
    get:
      tags: [admin]
      summary: Get configuration
      security:
        - AdminJWT: []
      description: Get current server configuration settings
      responses:
        '200':
          description: Configuration retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerConfig'
    
    put:
      tags: [admin]
      summary: Update configuration
      security:
        - AdminJWT: []
      description: Update server configuration (runtime only, not persistent)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigUpdate'
      responses:
        '200':
          description: Configuration updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigUpdateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /config:
    get:
      tags: [config]
      summary: Public upload limits
      description: |
        Live server limits so the uploader can check size and retention
        before encrypting. No authentication required.
      responses:
        '200':
          description: Current limits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicConfig'

  /admin/auth/login:
    post:
      tags: [auth]
      summary: Admin login
      description: |
        Password login. Returns a session JWT directly when the account has
        no MFA, otherwise a short-lived challenge token for /verify-mfa.
        Five bad passwords lock the account for 30 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated, or MFA challenge issued
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SessionResponse'
                  - $ref: '#/components/schemas/MfaChallenge'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/auth/verify-mfa:
    post:
      tags: [auth]
      summary: Complete MFA login
      description: Exchange a challenge token plus TOTP code (or backup code) for a session JWT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyMfaRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/auth/logout:
    post:
      tags: [auth]
      summary: Log out this session
      description: Revokes the current session server-side.
      security:
        - AdminJWT: []
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Logged out successfully"
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/auth/logout-all:
    post:
      tags: [auth]
      summary: Log out all sessions
      description: Revokes every session for the current admin user.
      security:
        - AdminJWT: []
      responses:
        '200':
          description: All sessions revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  sessionsTerminated:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/auth/refresh:
    post:
      tags: [auth]
      summary: Refresh token
      description: Mint a fresh JWT for the current session. Requires a still-valid token.
      security:
        - AdminJWT: []
      responses:
        '200':
          description: Fresh token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  expiresAt:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/auth/me:
    get:
      tags: [auth]
      summary: Current admin user
      description: Profile of the authenticated admin.
      security:
        - AdminJWT: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/AdminUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/auth/sessions:
    get:
      tags: [auth]
      summary: Current session info
      description: Identifies the calling session. Full session listing is not implemented yet.
      security:
        - AdminJWT: []
      responses:
        '200':
          description: Session info
          content:
            application/json:
              schema:
                type: object
                properties:
                  currentSession:
                    type: object
                    properties:
                      id:
                        type: string
                      current:
                        type: boolean
                        example: true
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/auth/mfa/setup:
    get:
      tags: [auth]
      summary: MFA setup material
      description: QR code, secret, and backup codes for an MFA-enabled account. Keep secret.
      security:
        - AdminJWT: []
      responses:
        '200':
          description: MFA material
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaSetup'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/security-summary:
    get:
      tags: [admin]
      summary: Security telemetry counts
      description: Attack and ban counts only. No IPs or request paths leave the server.
      security:
        - AdminJWT: []
      responses:
        '200':
          description: Telemetry counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecuritySummary'

  /admin/ct-monitor/status:
    get:
      tags: [admin]
      summary: CT monitor status
      description: Certificate Transparency monitor state and statistics.
      security:
        - AdminJWT: []
      responses:
        '200':
          description: Monitor status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CtMonitorStatus'

  /admin/ct-monitor/run:
    post:
      tags: [admin]
      summary: Force CT monitor run
      description: Starts a monitoring pass in the background; returns immediately.
      security:
        - AdminJWT: []
      responses:
        '200':
          description: Monitoring started
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string

  /admin/ct-monitor/domains:
    post:
      tags: [admin]
      summary: Add CT-monitored domain
      description: Adds a domain to the in-memory monitor list.
      security:
        - AdminJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain:
                  type: string
                  example: "example.com"
      responses:
        '200':
          description: Domain added
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'

  /security/csp-report:
    post:
      tags: [security]
      summary: CSP violation intake
      description: Browser reporting endpoint for Content-Security-Policy violations. Logged server-side.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Raw CSP violation report object from the browser.
      responses:
        '204':
          description: Report accepted (no content)

  /health:
    get:
      tags: [health]
      summary: Health check
      description: Check service health status and version
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheck'

components:
  schemas:
    UploadResponse:
      type: object
      required: [id, downloadUrl, expiresAt]
      properties:
        id:
          type: string
          format: uuid
          description: Unique file identifier
          example: "123e4567-e89b-12d3-a456-426614174000"
        downloadUrl:
          type: string
          description: Relative download URL
          example: "/api/download/123e4567-e89b-12d3-a456-426614174000"
        expiresAt:
          type: string
          format: date-time
          description: File expiration timestamp (ISO 8601)
          example: "2025-09-13T10:00:00.000Z"

    FileInfo:
      type: object
      required: [filename, size, contentType, uploadDate, expiresAt, downloadCount]
      properties:
        filename:
          type: string
          description: Original filename
          example: "document.pdf"
        size:
          type: integer
          description: File size in bytes
          example: 1048576
        contentType:
          type: string
          description: Original MIME type
          example: "application/pdf"
        uploadDate:
          type: string
          format: date-time
          description: Upload timestamp (ISO 8601)
          example: "2025-09-12T10:00:00.000Z"
        expiresAt:
          type: string
          format: date-time
          description: Expiration timestamp (ISO 8601)
          example: "2025-09-13T10:00:00.000Z"
        downloadCount:
          type: integer
          description: Number of times downloaded
          example: 3

    StorageStats:
      type: object
      required: [totalFiles, totalSize, expiredFiles, config]
      properties:
        totalFiles:
          type: integer
          description: Total number of files stored
          example: 150
        totalSize:
          type: integer
          description: Total storage used in bytes
          example: 524288000
        expiredFiles:
          type: integer
          description: Number of expired files pending cleanup
          example: 12
        config:
          $ref: '#/components/schemas/StorageConfig'

    StorageConfig:
      type: object
      properties:
        maxFileSize:
          type: integer
          description: Maximum file size in bytes
          example: 104857600
        defaultRetentionHours:
          type: integer
          example: 24
        maxRetentionHours:
          type: integer
          example: 168
        allowedExtensions:
          type: array
          items:
            type: string
          nullable: true
          description: Allowed file extensions (null = all allowed)

    CleanupResult:
      type: object
      required: [message, cleanedCount]
      properties:
        message:
          type: string
          example: "Cleaned up 12 expired files"
        cleanedCount:
          type: integer
          description: Number of files cleaned up
          example: 12

    ServerConfig:
      type: object
      required: [retention, rateLimiting, maxFileSize]
      properties:
        retention:
          type: object
          properties:
            defaultRetentionHours:
              type: integer
              example: 24
            maxRetentionHours:
              type: integer 
              example: 168
            cleanupIntervalMinutes:
              type: integer
              example: 60
            maxFileSize:
              type: integer
              example: 104857600
            allowedExtensions:
              type: array
              items:
                type: string
              nullable: true
        rateLimiting:
          type: object
          properties:
            windowMs:
              type: integer
              description: Rate limit window in milliseconds
              example: 900000
            maxRequests:
              type: integer
              description: Maximum requests per window
              example: 100
        maxFileSize:
          type: integer
          example: 104857600

    ConfigUpdate:
      type: object
      properties:
        defaultRetentionHours:
          type: integer
          minimum: 1
          maximum: 8760
          example: 48
        maxRetentionHours:
          type: integer
          minimum: 1
          maximum: 8760
          example: 336
        maxFileSize:
          type: integer
          minimum: 1024
          example: 209715200

    ConfigUpdateResponse:
      type: object
      required: [message, retention]
      properties:
        message:
          type: string
          example: "Configuration updated"
        retention:
          type: object
          properties:
            defaultRetentionHours:
              type: integer
              example: 48
            maxRetentionHours:
              type: integer
              example: 336
            maxFileSize:
              type: integer
              example: 209715200

    HealthCheck:
      type: object
      required: [status, timestamp, version]
      properties:
        status:
          type: string
          enum: [ok, error]
          example: "ok"
        timestamp:
          type: string
          format: date-time
          description: Current server timestamp (ISO 8601)
          example: "2025-09-12T10:00:00.000Z"
        version:
          type: string
          description: API version
          example: "1.0.0"

    PublicConfig:
      type: object
      required: [maxFileSize, defaultRetentionHours, maxRetentionHours]
      properties:
        maxFileSize:
          type: integer
          description: Largest accepted upload in bytes
          example: 104857600
        defaultRetentionHours:
          type: integer
          example: 24
        maxRetentionHours:
          type: integer
          example: 168

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: "admin"
        password:
          type: string
          format: password

    SessionResponse:
      type: object
      required: [token, expiresAt, user]
      properties:
        token:
          type: string
          description: Bearer [REDACTED] for the Authorization header
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/AdminUser'

    MfaChallenge:
      type: object
      required: [requiresMFA, challengeToken]
      properties:
        requiresMFA:
          type: boolean
          example: true
        challengeToken:
          type: string
          description: Short-lived token for /admin/auth/verify-mfa
        message:
          type: string

    VerifyMfaRequest:
      type: object
      required: [challengeToken, mfaToken]
      properties:
        challengeToken:
          type: string
        mfaToken:
          type: string
          description: 6-digit TOTP code or a backup code
          example: "123456"

    AdminUser:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: string
        mfaEnabled:
          type: boolean
        lastLogin:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    MfaSetup:
      type: object
      properties:
        qrCode:
          type: string
          description: QR code PNG as a data URL
        secret:
          type: string
          description: Base32 TOTP secret
        backupCodes:
          type: array
          items:
            type: string
        otpauthUrl:
          type: string

    SecuritySummary:
      type: object
      properties:
        attacksLast24h:
          type: integer
        totalAttacks:
          type: integer
        uniqueIPs:
          type: integer
        topCategory:
          type: object
          nullable: true
          properties:
            name:
              type: string
            count:
              type: integer
        bans:
          type: object
          properties:
            permanent:
              type: integer
            temporary:
              type: integer
            total:
              type: integer

    CtMonitorStatus:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            enabled:
              type: boolean
            monitoredDomains:
              type: array
              items:
                type: string
            knownCertificates:
              type: integer
            lastMonitoring:
              type: string
              format: date-time
            isRunning:
              type: boolean
            lastRun:
              type: string
              format: date-time
              nullable: true
            schedule:
              type: string
              example: "0 */6 * * *"

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error message
          example: "File not found or expired"

  responses:
    BadRequest:
      description: Bad request - invalid input parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            missing-file:
              summary: Missing file
              value:
                error: "No file uploaded"
            invalid-key:
              summary: Invalid encryption key
              value:
                error: "Missing encryption parameters"
            invalid-retention:
              summary: Invalid retention period
              value:
                error: "Retention period cannot exceed 168 hours"

    Unauthorized:
      description: Missing, invalid, expired, or revoked admin token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Authentication failed"

    NotFound:
      description: Resource not found or expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "File not found or expired"

    FileTooLarge:
      description: File exceeds size limit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "File too large"

    RateLimit:
      description: Rate limit exceeded
      headers:
        X-RateLimit-Limit:
          schema:
            type: integer
          description: Request limit per window
        X-RateLimit-Remaining:
          schema:
            type: integer
          description: Remaining requests in window
        X-RateLimit-Reset:
          schema:
            type: integer
          description: Unix timestamp when window resets
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Too many requests, please try again later"

    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Internal server error"

  securitySchemes:
    AdminJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Admin JWT from /api/admin/auth/login (TOTP MFA when enabled)